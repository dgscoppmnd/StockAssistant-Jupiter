# =============================================
# Configuración de autenticación para PostgreSQL
# =============================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Conexiones locales desde el contenedor
local   all             all                                     trust

# Conexiones desde la red Docker (todos los contenedores)
host    all             all             172.0.0.0/8            md5

# Conexiones desde el host (localhost)
host    all             all             127.0.0.1/32           md5

# Conexiones desde cualquier IP (solo para desarrollo)
host    all             all             0.0.0.0/0              md5