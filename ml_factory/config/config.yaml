database:
  url: "postgresql+psycopg2://admin:admin123@localhost:5433/supply_chain"
  tables:
    sales: sales
    inventory: inventory
    products: products
    suppliers: suppliers
    logistics: logistics
    warehouse: warehouses

model:
  stockout:
    name: stockout-predictor
    type: classification
  reorder:
    name: reorder-forecaster
    type: regression
  params:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: 4

mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: stockassistant-ml-factory
  registered_model_stage: Production

paths:
  artifacts: artifacts
  plots: artifacts/plots
