name: Integration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - master

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: supply_chain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d supply_chain"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: admin
      DB_PASSWORD: admin123
      DB_NAME: supply_chain

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            BackEnd/apps/MonoliticDataStructure/app/requirements/api.txt
            BackEnd/apps/MonoliticDataStructure/app/requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r BackEnd/apps/MonoliticDataStructure/app/requirements/dev.txt

      - name: Initialize test database
        env:
          PGPASSWORD: admin123
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql \
            -h localhost \
            -p 5432 \
            -U admin \
            -d supply_chain \
            -f BackEnd/apps/MonoliticDataStructure/app/docker/init-scripts/init.sql

      - name: Prepare upload directory for tests
        run: |
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /app/data/uploads
          test -w /app/data/uploads

      - name: Run backend tests
        id: tests
        working-directory: BackEnd/apps/MonoliticDataStructure/app
        run: |
          mkdir -p test-results
          set +e
          PYTHONPATH=".:src" pytest tests/ \
            --capture=tee-sys \
            --cov=src \
            --cov-report=term \
            --junitxml=test-results/results.xml \
            2>&1 | tee test-results/results.log
          test_exit=${PIPESTATUS[0]}
          echo "exit_code=$test_exit" >> "$GITHUB_OUTPUT"
          exit "$test_exit"

      - name: Comment test results on PR
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const resultsPath = 'BackEnd/apps/MonoliticDataStructure/app/test-results/results.log';

            if (!fs.existsSync(resultsPath)) {
              core.warning('Test results were not generated.');
              return;
            }

            const results = fs.readFileSync(resultsPath, 'utf8');
            const truncated = results.length > 65000
              ? results.slice(0, 65000) + '\n...TRUNCATED...'
              : results;

            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Backend test results\n\n\`\`\`\n${truncated}\n\`\`\``
            });