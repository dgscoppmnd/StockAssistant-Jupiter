name: Deploy AWS

on:
  push:
    branches: [master]
    paths:
      - "BackEnd/apps/MonoliticDataStructure/app/**"
      - "Frontend/**"
      - "infra/sql/migrations/**"
      - "infra/sql/01-roles.sql"
      - "infra/sql/05-migration-permissions.sql"
      - "infra/scripts/migrate.py"
      - "infra/scripts/requirements-migrations.txt"
      - "infra/scripts/tests/test_migrate.py"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Qué desplegar"
        type: choice
        options: [all, backend, frontend, migrations]
        default: all

concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  FUNCTION_NAME: stockassistant-api
  ECR_REPOSITORY: stockassistant-api
  BACKEND_DIR: BackEnd/apps/MonoliticDataStructure/app

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - name: Permitir despliegues solo desde master
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: |
          if [ "$DEPLOY_REF" != "refs/heads/master" ]; then
            echo "::error::Los despliegues AWS solo se permiten desde master."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend:
              - "BackEnd/apps/MonoliticDataStructure/app/**"
              - "infra/sql/migrations/**"
              - "infra/sql/01-roles.sql"
              - "infra/sql/05-migration-permissions.sql"
              - "infra/scripts/migrate.py"
              - "infra/scripts/requirements-migrations.txt"
              - "infra/scripts/tests/test_migrate.py"
              - ".github/workflows/deploy-aws.yml"
            frontend:
              - "Frontend/**"
              - ".github/workflows/deploy-aws.yml"

  migration-tests:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migrator
          POSTGRES_PASSWORD: migration-test-only
          POSTGRES_DB: migrations_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U migrator -d migrations_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r infra/scripts/requirements-migrations.txt
      - run: python infra/scripts/migrate.py --check
      - run: python -m unittest discover -s infra/scripts/tests -p test_migrate.py -v
        env:
          MIGRATIONS_TEST_DSN: "host=127.0.0.1 dbname=migrations_test user=migrator password=migration-test-only"

  backend-build:
    needs: [changes, migration-tests]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.backend == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'backend'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login a Amazon ECR Public (Lambda Web Adapter)
        shell: bash
        run: |
          set -euo pipefail
          # ECR Public requiere us-east-1; el despliegue sigue en AWS_REGION.
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      - uses: docker/setup-buildx-action@v3

      - name: Build y push (linux/amd64, tag = SHA)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_DIR }}
          file: ${{ env.BACKEND_DIR }}/Dockerfile.lambda
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          build-args: |
            REQUIREMENTS_FILE=requirements/lambda.txt
            APP_MODULE=src.api.main:app
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrations:
    needs: [changes, migration-tests, backend-build]
    if: >-
      always() && !cancelled() &&
      needs.changes.result == 'success' && needs.migration-tests.result == 'success' &&
      (needs.backend-build.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'migrations'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r infra/scripts/requirements-migrations.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Validar y aplicar init.sql y migraciones pendientes
        env:
          PGHOST: ${{ vars.DB_MIGRATION_HOST }}
          PGDATABASE: ${{ vars.DB_MIGRATION_DATABASE }}
          PGUSER: migrator
          PGPORT: "5432"
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ runner.temp }}/rds-global-bundle.pem
          DB_LEGACY_TIMEZONE: ${{ vars.DB_LEGACY_TIMEZONE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PGHOST" || { echo "::error::Falta DB_MIGRATION_HOST en production"; exit 1; }
          test -n "$PGDATABASE" || { echo "::error::Falta DB_MIGRATION_DATABASE en production"; exit 1; }
          curl --fail --silent --show-error --retry 3 \
            https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -o "$PGSSLROOTCERT"
          PGPASSWORD="$(aws ssm get-parameter --name /stockassistant/prod/db/migrator_password \
            --with-decryption --query Parameter.Value --output text)"
          test -n "$PGPASSWORD" && test "$PGPASSWORD" != "None"
          echo "::add-mask::$PGPASSWORD"
          export PGPASSWORD
          trap 'unset PGPASSWORD' EXIT
          python infra/scripts/migrate.py

  backend:
    needs: [backend-build, migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Actualizar Lambda
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "${account}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}" \
            --query LastUpdateStatus --output text
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

      - name: Smoke test
        run: |
          # Sin API key: 401/403 prueba que la Lambda arranca y responde; 5xx rompe el job
          code=$(curl -s -m 90 -o /dev/null -w "%{http_code}" "https://${{ vars.CLOUDFRONT_DOMAIN }}/api/v1/products/?limit=1")
          echo "HTTP $code"
          case "$code" in 200|401|403) ;; *) exit 1 ;; esac

  frontend:
    needs: [changes, migration-tests, backend-build, migrations, backend]
    if: >-
      always() && !cancelled() &&
      needs.changes.result == 'success' && needs.migration-tests.result == 'success' &&
      (needs.backend-build.result == 'success' || needs.backend-build.result == 'skipped') &&
      (needs.migrations.result == 'success' || needs.migrations.result == 'skipped') &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      ((github.event_name == 'push' && needs.changes.outputs.frontend == 'true') ||
       (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'frontend')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - run: npm ci

      - name: Comprobar tipos
        run: npx --no-install tsc --noEmit

      - name: Comprobar sesion y permisos HTTP
        run: node --test tests/api-session.test.mjs

      - name: Build (Google client id público desde SSM)
        run: |
          VITE_GOOGLE_CLIENT_ID="$(aws ssm get-parameter --name /stockassistant/prod/google_client_id --with-decryption --query Parameter.Value --output text)"
          test -n "$VITE_GOOGLE_CLIENT_ID"
          test "$VITE_GOOGLE_CLIENT_ID" != "None"
          export VITE_GOOGLE_CLIENT_ID
          npm run build

      - name: Sync a S3
        run: aws s3 sync dist "s3://${{ vars.FRONTEND_BUCKET }}" --delete

      - name: Invalidar CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
